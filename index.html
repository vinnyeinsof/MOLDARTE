<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Básico e Avançado -->
    <title>Moldarte | Arte e Design em Impressão 3D</title>
    <meta name="description" content="Catálogo oficial da Moldarte. Descubra peças exclusivas, vasos decorativos e suportes com design refinado, produzidos em impressão 3D de alta resolução.">
    <meta name="keywords" content="Moldarte, Impressão 3D, Decoração 3D, PLA Silk, PLA Velvet, Vasos Decorativos, Suportes, Arte 3D, São Bernardo do Campo">
    <meta name="author" content="Moldarte">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph (Compartilhamento no WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.moldarte.com.br/">
    <meta property="og:title" content="Moldarte | Arte e Design em Impressão 3D">
    <meta property="og:description" content="Descubra peças exclusivas, produzidas em impressão 3D de alta resolução.">
    <meta property="og:image" content="Logo MoldArte.png">
    
    <!-- Canonical Tag (Evita punição do Google por conteúdo duplicado) -->
    <link rel="canonical" href="https://www.moldarte.com.br/">

    <!-- Fontes e Estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="header-container">
            <img src="Logo MoldArte.png" alt="Logotipo Moldarte" class="logo">
            <nav class="nav-links">
                <a href="#catalogo">Catálogo</a>
                <a href="https://br.shp.ee/pRZzhTLD" target="_blank" rel="noopener">Shopee</a>
                <a href="https://wa.me/c/5511922099723" target="_blank" rel="noopener">WhatsApp</a>
            </nav>
        </div>
    </header>

    <!-- Seção Hero (Banner Principal) -->
    <section class="hero">
        <div class="hero-content">
            <h1>Design encontra Precisão</h1>
            <p>Peças decorativas e utilitários fabricados com a mais alta tecnologia de impressão 3D.</p>
            <a href="#catalogo" class="btn-primary">Ver Coleção</a>
        </div>
    </section>

    <!-- Catálogo de Produtos -->
    <main id="catalogo" class="catalog-section">
        <div class="section-title">
            <h2>Nossas Peças</h2>
            <div class="divider"></div>
        </div>
        
        <div class="catalog-grid" id="product-grid">
            <!-- Produtos injetados via JavaScript -->
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="footer-content">
            <img src="Logo MoldArte.png" alt="Logotipo Moldarte" class="footer-logo">
            <p>&copy; 2026 Moldarte. Todos os direitos reservados.</p>
            <p>São Bernardo do Campo, SP</p>
        </div>
    </footer>

    <script src="app.js"></script>
    
    <!-- Schema.org Markup para SEO Local e E-commerce -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Moldarte",
      "image": "https://www.moldarte.com.br/Logo%20MoldArte.png",
      "description": "Peças exclusivas, decorativas e suportes produzidos em impressão 3D.",
      "url": "https://www.moldarte.com.br",
      "telephone": "+5511922099723",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "São Bernardo do Campo",
        "addressRegion": "SP",
        "addressCountry": "BR"
      }
    }
    </script>
</body>
</html>
